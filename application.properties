# ============================================================
# CWR Anomaly Detection Engine — Application Configuration
# ============================================================

server.port=8080
spring.application.name=cwr-anomaly-engine

# Logging levels
logging.level.com.railways.anomaly=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Serve static resources (the HTML dashboard) from /static/
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true
